services:

  # ==========================================================

  # OpenLDAP

  # ==========================================================

  openldap:

    image: osixia/openldap:1.5.0

    container_name: openldap

    environment:

      LDAP_ORGANISATION: "Example Inc."

      LDAP_DOMAIN: "example.org"

      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}"

      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD:?Set LDAP_CONFIG_PASSWORD in .env}"

      LDAP_TLS: "false"

    ports:

      - "389:389"

    volumes:

      - openldap_data:/var/lib/ldap

      - openldap_config:/etc/ldap/slapd.d

    healthcheck:

      test:

        - CMD-SHELL

        - 'ldapsearch -x -H ldap\://localhost:389 -D "cn=admin,dc=example,dc=org" -w "$$LDAP_ADMIN_PASSWORD" -b "dc=example,dc=org" -s base "(objectClass=\*)" dn >/dev/null 2>&1'

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s

    restart: unless-stopped



  # ==========================================================

  # OpenLDAP OU Initialization

  # ==========================================================

  openldap-init:
    image: osixia/openldap:1.5.0
    container_name: openldap-init

    depends_on:
      openldap:
        condition: service_healthy

    environment:
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}"

    volumes:
      - ./people.ldif:/tmp/people.ldif:ro

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo "Checking LDAP people OU..."

        if ldapsearch -x \
          -H ldap://openldap:389 \
          -D "cn=admin,dc=example,dc=org" \
          -w "$${LDAP_ADMIN_PASSWORD}" \
          -b "ou=people,dc=example,dc=org" \
          -s base \
          '(objectClass=organizationalUnit)' dn \
          >/dev/null 2>&1; then

          echo "OU already exists. Skipping initialization."

        else
          echo "OU does not exist. Creating from people.ldif..."

          ldapadd -x \
            -H ldap://openldap:389 \
            -D "cn=admin,dc=example,dc=org" \
            -w "$${LDAP_ADMIN_PASSWORD}" \
            -f /tmp/people.ldif

          echo "OU initialization completed."
        fi

    restart: "no"


  # ==========================================================

  # phpLDAPadmin

  # ==========================================================



  phpldapadmin:

    image: osixia/phpldapadmin:0.9.0

    container_name: phpldapadmin

    environment:

      PHPLDAPADMIN_LDAP_HOSTS: openldap

      PHPLDAPADMIN_HTTPS: "false"

    ports:

      - "8081:80"

    depends_on:

      openldap:

        condition: service_healthy

    restart: unless-stopped



  # ==========================================================

  # Keycloak

  # ==========================================================

  keycloak:

    image: quay.io/keycloak/keycloak:26.7.4

    container_name: keycloak

    command:

      - start-dev

      - --import-realm

    environment:

      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"

      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"

      # Keep the issuer consistent with the URL used by browser clients.

      KC_HOSTNAME: "http://localhost:8080"

    ports:

      - "8080:8080"

    volumes:

      - keycloak_data:/opt/keycloak/data

      - ./keycloak:/opt/keycloak/data/import:ro

    depends_on:

      openldap:

        condition: service_healthy

    restart: unless-stopped



  # ==========================================================
  # Keycloak LDAP User Federation Initialization
  # Adds or updates the LDAP provider in the hdaic realm.
  # ==========================================================

  keycloak-ldap-init:
    image: alpine:3.21
    container_name: keycloak-ldap-init
    depends_on:
      keycloak:
        condition: service_started
      openldap:
        condition: service_healthy
      openldap-init:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"
      KEYCLOAK_REALM: "hdaic"
      LDAP_BIND_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}"
      LDAP_USERS_DN: "${LDAP_USERS_DN:-ou=people,dc=example,dc=org}"
      LDAP_BIND_DN: "${LDAP_BIND_DN:-cn=admin,dc=example,dc=org}"
    volumes:
      - ./keycloak-ldap-init.sh:/usr/local/bin/keycloak-ldap-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/keycloak-ldap-init.sh"]
    restart: "no"

  # ==========================================================

  # Kafka (KRaft, internal and host listeners)

  # ==========================================================

  kafka:

    image: apache/kafka:3.9.0

    container_name: kafka

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:

      - "9092:9092"

    healthcheck:

      test:

        - CMD-SHELL

        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"

      interval: 10s

      timeout: 10s

      retries: 10

      start_period: 20s

    restart: unless-stopped



  # ==========================================================

  # Kafka Topic Initialization

  # ==========================================================

  kafka-init:

    image: apache/kafka:3.9.0

    container_name: kafka-init

    depends_on:

      kafka:

        condition: service_healthy

    entrypoint: ["/bin/bash", "-ec"]

    command:

      - |

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic usage-events --partitions 3 --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic pipeline-status --partitions 3 --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic security-events --partitions 3 --replication-factor 1

        echo "Kafka topics ready"

    restart: "no"



  # ==========================================================

  # MinIO

  # ==========================================================

  minio:

    build:

      context: ./minio

      dockerfile: Dockerfile

    image: local/minio-community:latest

    container_name: minio

    environment:

      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"

      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"

    command:

      - server

      - /data

      - --console-address

      - ":9001"

    ports:

      - "9000:9000"

      - "9002:9001"

    volumes:

      - minio_data:/data

    restart: unless-stopped



  # ==========================================================

  # Spark Structured Streaming + Iceberg

  # Refactored files should be in ./spark:

  #   pipeline.py, common/\*.py

  # ==========================================================

  spark:

    build:

      context: ./spark

      dockerfile: Dockerfile

    image: local/spark-iceberg:3.5.7

    pull_policy: build

    container_name: spark

    environment:

      PYTHONPATH: "/opt/spark/work"

      PYTHONUNBUFFERED: "1"

      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

      KAFKA_SOURCE_TOPIC: "usage-events"

      KAFKA_STATUS_TOPIC: "pipeline-status"

      ICEBERG_TABLE: "local.usage_db.usage_events"

      ICEBERG_WAREHOUSE: "s3a://warehouse/"

      MINIO_ENDPOINT: "http://minio:9000"

      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"

      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"

      MINIO_BUCKET: "warehouse"

      MINIO_TABLE_PREFIX: "usage_db/usage_events"

      CHECKPOINT_LOCATION: "s3a://warehouse/checkpoints/full_usage_pipeline"

      PROCESSING_INTERVAL: "5 seconds"

    volumes:

      - ./spark:/opt/spark/work

    command:

      - /opt/spark/bin/spark-submit

      - /opt/spark/work/pipeline.py

    depends_on:

      kafka:

        condition: service_healthy

      kafka-init:

        condition: service_completed_successfully

      minio:

        condition: service_started

    restart: unless-stopped



  # ==========================================================

  # Iceberg Query API

  # Refactored query_api.py uses common/\* from same mounted ./spark directory.

  # ==========================================================

  iceberg-query:

    build:

      context: ./spark

      dockerfile: Dockerfile

    image: local/spark-iceberg:3.5.7

    pull_policy: build

    container_name: iceberg-query

    environment:

      PYTHONPATH: "/opt/spark/work"

      PYTHONUNBUFFERED: "1"

      ICEBERG_QUERY_HOST: "0.0.0.0"

      ICEBERG_QUERY_PORT: "8010"

      ICEBERG_TABLE: "local.usage_db.usage_events"

      ICEBERG_WAREHOUSE: "s3a://warehouse/"

      MINIO_ENDPOINT: "http://minio:9000"

      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"

      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"

      MINIO_BUCKET: "warehouse"

      MINIO_TABLE_PREFIX: "usage_db/usage_events"

    volumes:

      - ./spark:/opt/spark/work

    command:

      - /opt/spark/bin/spark-submit

      - /opt/spark/work/query_api.py

    expose:

      - "8010"

    depends_on:

      minio:

        condition: service_started

      spark:

        condition: service_started

    restart: unless-stopped



  # ==========================================================

  # FastAPI

  # ==========================================================

  api:

    build:

      context: ./api

      dockerfile: Dockerfile

    image: local/usage-api:latest

    container_name: api

    environment:

      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"

      KEYCLOAK_ISSUER: "http://localhost:8080/realms/hdaic"

      KEYCLOAK_REALM: "hdaic"

      KEYCLOAK_CLIENT_ID: "usage-api"

      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

      KAFKA_TOPIC: "usage-events"

      PIPELINE_STATUS_TOPIC: "pipeline-status"

      MAX_PIPELINE_EVENTS: 100

      LDAP_HOST: "${LDAP_HOST:-openldap}"

      LDAP_PORT: "${LDAP_PORT:-389}"

      LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=example,dc=org}"

      LDAP_USERS_DN: "${LDAP_USERS_DN:-ou=people,dc=example,dc=org}"

      LDAP_BIND_DN: "${LDAP_BIND_DN:-cn=admin,dc=example,dc=org}"

      LDAP_BIND_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env}"

      LDAP_ADMIN_ROLE: "${LDAP_ADMIN_ROLE:-ldap-admin}"

      ICEBERG_QUERY_URL: "http://iceberg-query:8010"

    ports:

      - "8000:8000"

    depends_on:

      keycloak:

        condition: service_started

      keycloak-ldap-init:

        condition: service_completed_successfully

      kafka:

        condition: service_healthy

      kafka-init:

        condition: service_completed_successfully

      openldap:

        condition: service_healthy

      openldap-init:

        condition: service_completed_successfully

      iceberg-query:

        condition: service_started

    restart: unless-stopped



  # ==========================================================

  # Next.js Frontend

  # ==========================================================

  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    image: local/dataplatform-frontend:latest

    container_name: frontend

    ports:

      - "3000:3000"

    depends_on:

      api:

        condition: service_started

    restart: unless-stopped



  # ==========================================================

  # Security Agent

  # ==========================================================

  security-agent:

    build:

      context: ./security-agent

      dockerfile: Dockerfile

    container_name: security-agent

    environment:

      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

      SECURITY_TOPIC: "security-events"

      SECURITY_CONSUMER_GROUP: "security-defense-agent"

      BRUTE_FORCE_THRESHOLD: "5"

      BRUTE_FORCE_WINDOW_SECONDS: "60"

    depends_on:

      kafka:

        condition: service_healthy

      kafka-init:

        condition: service_completed_successfully

    restart: unless-stopped



volumes:

  openldap_data:

  openldap_config:

  keycloak_data:

  minio_data:
