services:

  # ==========================================================
  # Keycloak
  # ==========================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak

    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:8080

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

    ports:
      - "8080:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/hdaic-realm.json:/opt/keycloak/data/import/hdaic-realm.json:ro


  # ==========================================================
  # Kafka
  # ==========================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    ports:
      - "9092:9092"


  # ==========================================================
  # FastAPI
  # ==========================================================
  api:
    build: ./api
    container_name: usage-api

    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/hdaic
      KEYCLOAK_REALM: hdaic
      KEYCLOAK_CLIENT_ID: usage-api

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: usage-events

    ports:
      - "8000:8000"

    depends_on:
      - keycloak
      - kafka


  # ==========================================================
  # Python Consumer
  # ==========================================================
  consumer:
    build: ./consumer
    container_name: kafka-consumer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: usage-events
      KAFKA_GROUP_ID: usage-consumer

    depends_on:
      - kafka


  # ==========================================================
  # Python Producer
  # ==========================================================
  producer:
    build: ./producer
    container_name: kafka-producer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: usage-events

    depends_on:
      - kafka


# ============================================================
# Volumes
# ============================================================
volumes:

  keycloak_data: